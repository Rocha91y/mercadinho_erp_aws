name: Pipeline Lakehouse Mercadinho ERP - Legado

on:
  push:
    branches: [ main ]  # Dispara a cada push na branch principal
    paths-ignore:       # ...exceto quando o commit só mexe nestes caminhos
      - 'ETL/SQL/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:    # Botão "Run workflow" para rodar na mão

jobs:
  run-legado-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório para o servidor do GitHub
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python na nuvem
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

   # 3. Instala as bibliotecas necessárias
      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install boto3 openpyxl pandas unidecode pyarrow
   # coloquei o unicode para ler os ajustes feitos no py da trusted. | E agora o pyarrow para o Parquet

          

      # 4. Configura as credenciais da AWS para o Boto3 usar na nuvem
      - name: Configurar Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

            # 5. Executa o pipeline
      - name: Executar Pipeline
        run: |
          python ETL/legado/legado_upload.py
          python ETL/raw/legado_to_raw.py
          python ETL/trusted/raw_to_trusted.py
          # python ETL/curated/run_ctas_athena.py
