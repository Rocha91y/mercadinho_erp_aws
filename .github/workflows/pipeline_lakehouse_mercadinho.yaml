name: Pipeline Lakehouse Mercadinho ERP - Legado

on:
  push:
    branches: [ main ]  # Dispara a cada push na branch principal

  workflow_dispatch:    # Botão "Run workflow" para rodar na mão

  #========================REMOVIDO! APLIQUEI O DISPARO PELO AWS EVENTBRIDGE (VERIFICAR EM DOCS/otimizando_automacao.md)========================#
  # Agendamento 3x ao dia. O horário do cron é em UTC (Brasília = UTC-3).
  # Minutos "quebrados" (47, 23, 41) de propósito: o GitHub atrasa muito as execuções (Meu antigo estava demorando 6 horas)
  # marcadas na hora cheia (:00), porque todo mundo agenda ali.
  # schedule:
  # - cron: '33 */3 * * *' # Roda de 3 em 3 horas, no minuto 33 (00:33, 03:33, 06:33, 09:33, 12:33, 15:33, 18:33, 21:33)



  #========================REMOVIDO! APLIQUEI O DISPARO PELO AWS EVENTBRIDGE (VERIFICAR EM DOCS/OTIMIZACAO_AUTOMACAO.md)========================#

concurrency:                              # Só uma execução por vez: evita que um push e um agendamento rodem juntos
  group: pipeline-lakehouse-mercadinho    # e briguem pelas mesmas pastas do S3 (o CTAS apaga e recria a pasta de destino).
  cancel-in-progress: false

jobs:
  run-legado-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório para o servidor do GitHub
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python na nuvem
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala as bibliotecas necessárias
      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install boto3 openpyxl pandas unidecode pyarrow

      # 4. CI (Integração Contínua) - Validação prévia de sintaxe do código antes da AWS
      - name: Validar Sintaxe dos Scripts Python (CI)
        run: |
          echo "Verificando se há erros de sintaxe nos scripts de ETL..."
          python -m py_compile ETL/legado/legado_upload.py
          python -m py_compile ETL/raw/legado_to_raw.py
          python -m py_compile ETL/trusted/raw_to_trusted.py
          python -m py_compile ETL/curated/run_ctas_athena.py
          python -m py_compile ETL/ci/validar_sql.py
          echo "Validação de CI concluída com sucesso!"

      # 5. CI (Integração Contínua) - Validação dos arquivos SQL da Curated, também antes da AWS
      - name: Validar Arquivos SQL da Curated (CI)
        run: python ETL/ci/validar_sql.py

      # 6. Configura as credenciais da AWS para o Boto3 usar na nuvem
      - name: Configurar Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 7. Executa o pipeline de CD (Deploy e Execução)
      - name: Executar Pipeline (CD)
        run: |
          python ETL/legado/legado_upload.py
          python ETL/raw/legado_to_raw.py
          python ETL/trusted/raw_to_trusted.py
          python ETL/curated/run_ctas_athena.py