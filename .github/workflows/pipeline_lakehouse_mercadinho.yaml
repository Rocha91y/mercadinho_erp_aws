name: Pipeline Lakehouse Mercadinho ERP

on:
  push:
    branches: [ main ]  # Dispara automaticamente a cada push na branch principal

jobs:
  run-etl-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório para o servidor do GitHub
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python na nuvem
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Ou a versão que você está usando no projeto

      # 3. Instala as bibliotecas necessárias (boto3, pandas, supabase, etc.)
      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas supabase openpyxl

      # 4. Configura as credenciais da AWS para o Boto3 usar na nuvem
      - name: Configurar Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 5. Executa a Ingestão (Legado / Raw)
      - name: Executar Script Legado e Raw
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python ETL/legado/legado_upload.py
          python ETL/raw/legado_to_raw.py

      # 6. Executa a Transformação (Trusted)
      - name: Executar Camada Trusted
        run: |
          python ETL/trusted/raw_to_trusted.py

      # 7. Executa a Camada Curated e Athena
      - name: Executar Camada Curated (Athena)
        run: |
          python ETL/curated/run_ctas_athena.py